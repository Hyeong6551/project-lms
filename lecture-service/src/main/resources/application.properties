spring.application.name=lecture-service

server.port=9696

spring.datasource.url=jdbc:h2:mem:lecturedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

h2.console.enabled=true
h2.console.path=/h2-console
h2.console.settings.web-allow-others=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# 로깅 설정
logging.level.root=INFO
logging.level.edu.ct=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.web.cors.enabled=false

spring.web.resources.static-locations=file:uploads/

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

