server:
  port: 9898

spring:
  application:
    name: gateway-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
        - id: notice-service
          uri: lb://NOTICE-SERVICE
          predicates:
            - Path=/api/notices/**
        - id: lecture-service
          uri: lb://LECTURE-SERVICE
          predicates:
            - Path=/api/lectures/**
        - id: grading-service
          uri: lb://GRADING-SERVICE
          predicates:
            - Path=/api/grading/**
        - id: exam-service
          uri: lb://EXAM-SERVICE
          predicates:
            - Path=/api/exams/**
        - id: progress-service
          uri: lb://PROGRESS-SERVICE
          predicates:
            - Path=/api/progress/**
        - id: admin-service
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/admins/**

coolsms:
  api:
    key: NCSZ1KJRQ5SEN11M
    secret: NADVY6NH93V1QMQDHD41ZPBR6AUAMW5F

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true 